name: Profile contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: hapashy
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#ff7a1a&color_dots=#1b1033,#46305f,#78517d,#c98e78,#f3ead8

      - name: Publish generated SVG to output branch
        run: |
          cp dist/github-snake.svg "$RUNNER_TEMP/github-snake.svg"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin output; then
            git fetch origin output
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf .
          fi
          cp "$RUNNER_TEMP/github-snake.svg" github-snake.svg
          git add github-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update contribution snake'
          fi
          git push origin HEAD:output
